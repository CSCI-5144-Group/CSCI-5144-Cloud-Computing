  node-b:
    command: ["uvicorn", "storage.node:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--no-access-log", "--log-level", "warning"]
  node-c:
    command: ["uvicorn", "storage.node:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--no-access-log", "--log-level", "warning"]
